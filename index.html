<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Fan-made Pixel Worlds gems calculator for mining (and fishing soon). Not affiliated with the game or its publishers."
    />
    <title>Pixel Worlds Tools</title>
    <link rel="icon" href="assets/icon1.png" type="image/png" />
    <link rel="apple-touch-icon" href="assets/icon1.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app">
      <header class="top-nav" role="banner">
        <h1 class="brand-heading">
          <img
            class="brand-logo"
            src="assets/pixelworldslogo.png"
            alt="Pixel Worlds"
            decoding="async"
            fetchpriority="high"
          />
        </h1>
        <div class="top-nav-actions">
          <div
            class="lang-toggle"
            role="group"
            data-i18n-attr="aria-label|nav.langAria"
            aria-label="Bahasa"
          >
            <button
              type="button"
              class="lang-btn lang-btn--active"
              data-lang-btn="id"
              data-lang-set="id"
              aria-pressed="true"
            >
              ID
            </button>
            <button
              type="button"
              class="lang-btn"
              data-lang-btn="en"
              data-lang-set="en"
              aria-pressed="false"
            >
              EN
            </button>
          </div>
          <nav
            class="top-nav__tabs tabs"
            data-i18n-attr="aria-label|nav.aria"
            aria-label="Mode kalkulator"
          >
            <button type="button" class="tab tab--active" data-panel="mining" aria-selected="true">
              <span data-i18n="tab.mining">Mining</span>
            </button>
            <button type="button" class="tab" data-panel="fishing" aria-selected="false">
              <span data-i18n="tab.fishing">Fishing</span>
            </button>
          </nav>
        </div>
      </header>

      <main>
        <section id="panel-mining" class="panel panel--active" aria-labelledby="mining-heading">
          <div class="panel-head">
            <h2 id="mining-heading" class="panel-title" data-i18n="mining.title">Mining Gems</h2>
            <div
              class="total-inline"
              role="group"
              data-i18n-attr="aria-label|mining.totalAria"
              aria-label="Total gems mining"
            >
              <span class="total-label" data-i18n="mining.totalLabel">Total gems</span>
              <output id="mining-total" class="total-value" for="mining-rows">0</output>
            </div>
          </div>
          <p class="panel-desc" data-i18n="mining.desc">
            Enter the amount of each type; the total is calculated automatically.
          </p>
          <div id="mining-rows" class="calc-grid"></div>
        </section>

        <section id="panel-fishing" class="panel" hidden aria-labelledby="fishing-heading">
          <h2 id="fishing-heading" class="panel-title" data-i18n="fishing.title">Fishing</h2>
          <p class="panel-desc muted" data-i18n="fishing.placeholder">
            Bagian ini akan ditambahkan setelah mining selesai.
          </p>
        </section>
      </main>

      <footer class="footer">
        <p class="footer-disclaimer" data-i18n="footer.disclaimer"></p>
        <p class="footer-credit" data-i18n-html="footer.creditHtml"></p>
      </footer>
    </div>
    <script src="js/i18n.js"></script>
    <script src="js/mining.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
