<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Fan-made Pixel Worlds gems calculator for mining (and fishing soon). Not affiliated with the game or its publishers."
    />
    <title>Pixel Worlds Tools</title>
    <link rel="icon" href="assets/icon1.png" type="image/png" />
    <link rel="apple-touch-icon" href="assets/icon1.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app">
      <header class="top-nav" role="banner">
        <div class="brand-block">
          <h1 class="brand-heading">
            <img
              class="brand-logo"
              src="assets/pixelworldslogo.png"
              alt="Pixel Worlds"
              decoding="async"
              fetchpriority="high"
            />
          </h1>
          <p class="dev-notice" role="status">
            <span class="dev-notice__icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
                <path
                  fill-rule="evenodd"
                  d="M8.485 2.495c.675-1.171 2.357-1.171 3.032 0l6.28 10.875c.666 1.154-.224 2.595-1.516 2.595H3.72c-1.292 0-2.182-1.441-1.516-2.595l6.28-10.875zM10 5a.75.75 0 01.75.75v3.5a.75.75 0 01-1.5 0v-3.5A.75.75 0 0110 5zm0 9a1 1 0 100-2 1 1 0 000 2z"
                  clip-rule="evenodd"
                />
              </svg>
            </span>
            <span class="dev-notice__text" data-i18n="nav.devNotice">
              Situs masih dalam pengembangan — nilai gems fishing sedang diproses.
            </span>
          </p>
        </div>
        <div class="top-nav-actions">
          <div class="nav-toolbar">
            <div
              class="segmented segmented--lang lang-toggle"
              role="group"
              data-i18n-attr="aria-label|nav.langAria"
              aria-label="Bahasa"
            >
              <button
                type="button"
                class="lang-btn lang-btn--active"
                data-lang-btn="id"
                data-lang-set="id"
                aria-pressed="true"
              >
                <span class="lang-btn__inner">
                  <span class="lang-flag" aria-hidden="true">
                    <svg viewBox="0 0 3 2" xmlns="http://www.w3.org/2000/svg" focusable="false">
                      <rect width="3" height="1" fill="#e70011" />
                      <rect width="3" height="1" y="1" fill="#ffffff" />
                    </svg>
                  </span>
                  <span class="lang-btn__label">ID</span>
                </span>
              </button>
              <button
                type="button"
                class="lang-btn"
                data-lang-btn="en"
                data-lang-set="en"
                aria-pressed="false"
              >
                <span class="lang-btn__inner">
                  <span class="lang-flag" aria-hidden="true">
                    <svg viewBox="0 0 60 30" xmlns="http://www.w3.org/2000/svg" focusable="false">
                      <path fill="#012169" d="M0 0h60v30H0z" />
                      <path stroke="#fff" stroke-width="6" d="M0 0l60 30M60 0L0 30" />
                      <path stroke="#c8102e" stroke-width="4" d="M0 0l60 30M60 0L0 30" />
                      <path stroke="#fff" stroke-width="10" d="M30 0v30M0 15h60" />
                      <path stroke="#c8102e" stroke-width="6" d="M30 0v30M0 15h60" />
                    </svg>
                  </span>
                  <span class="lang-btn__label">EN</span>
                </span>
              </button>
            </div>
            <nav
              class="segmented segmented--tabs top-nav__tabs tabs"
              data-i18n-attr="aria-label|nav.aria"
              aria-label="Mode kalkulator dan panduan"
            >
              <button type="button" class="tab tab--active" data-panel="mining" aria-selected="true">
                <span data-i18n="tab.mining">Mining</span>
              </button>
              <button type="button" class="tab" data-panel="fishing" aria-selected="false">
                <span data-i18n="tab.fishing">Fishing</span>
              </button>
              <button type="button" class="tab" data-panel="guide" aria-selected="false">
                <span data-i18n="tab.guide">Guide</span>
              </button>
            </nav>
          </div>
        </div>
      </header>

      <main>
        <section id="panel-mining" class="panel panel--active" aria-labelledby="mining-heading">
          <div class="panel-head">
            <h2 id="mining-heading" class="panel-title" data-i18n="mining.title">Mining Gems</h2>
            <div
              class="total-inline"
              role="group"
              data-i18n-attr="aria-label|mining.totalAria"
              aria-label="Total gems mining"
            >
              <span class="total-label" data-i18n="mining.totalLabel">Total gems</span>
              <output id="mining-total" class="total-value" for="mining-rows">0</output>
            </div>
          </div>
          <p class="panel-desc" data-i18n="mining.desc">
            Enter the amount of each type; the total is calculated automatically.
          </p>
          <div id="mining-rows" class="calc-grid"></div>
        </section>

        <section id="panel-fishing" class="panel" hidden aria-labelledby="fishing-heading">
          <div class="panel-head">
            <h2 id="fishing-heading" class="panel-title" data-i18n="fishing.title">Fishing Gems</h2>
            <div
              class="total-inline"
              role="group"
              data-i18n-attr="aria-label|fishing.totalAria"
              aria-label="Total gems fishing"
            >
              <span class="total-label" data-i18n="fishing.totalLabel">Total gems</span>
              <output id="fishing-total" class="total-value" for="fishing-rows">0</output>
            </div>
          </div>
          <p class="panel-desc" data-i18n="fishing.desc">
            Masukkan jumlah tiap jenis ikan; total dihitung otomatis.
          </p>
          <div id="fishing-rows" class="calc-grid"></div>
        </section>

        <section id="panel-guide" class="panel" hidden aria-labelledby="guide-heading">
          <div class="panel-head">
            <h2 id="guide-heading" class="panel-title" data-i18n="guide.title">Guide</h2>
          </div>
          <nav
            class="guide-subtabs segmented segmented--subtabs"
            role="tablist"
            data-i18n-attr="aria-label|guide.subtabsAria"
            aria-label="Pilih topik panduan"
          >
            <button
              type="button"
              class="guide-subtab guide-subtab--active"
              role="tab"
              data-guide-sub="nether"
              aria-selected="true"
            >
              <span data-i18n="guide.subtab.nether">Nether</span>
            </button>
            <button
              type="button"
              class="guide-subtab"
              role="tab"
              data-guide-sub="mining"
              aria-selected="false"
            >
              <span data-i18n="guide.subtab.mining">Mining</span>
            </button>
            <button
              type="button"
              class="guide-subtab"
              role="tab"
              data-guide-sub="fishing"
              disabled
              aria-selected="false"
              aria-disabled="true"
              data-i18n-attr="title|guide.subtabDisabledTitle"
              title="Segera"
            >
              <span data-i18n="guide.subtab.fishing">Fishing</span>
            </button>
          </nav>

          <div
            id="guide-view-nether"
            class="guide-subpanel guide-subpanel--active"
            role="tabpanel"
            data-guide-panel="nether"
          >
            <div id="guide-nether-root"></div>
          </div>
          <div
            id="guide-view-mining"
            class="guide-subpanel"
            hidden
            role="tabpanel"
            data-guide-panel="mining"
          >
            <div id="guide-mining-root"></div>
          </div>
          <div
            id="guide-view-fishing"
            class="guide-subpanel"
            hidden
            role="tabpanel"
            data-guide-panel="fishing"
          >
            <p class="panel-desc muted guide-soon" data-i18n="guide.soon">Segera hadir.</p>
          </div>
        </section>
      </main>

      <footer class="footer">
        <p class="footer-disclaimer" data-i18n="footer.disclaimer"></p>
        <p class="footer-credit" data-i18n-html="footer.creditHtml"></p>
        <nav
          class="footer-social"
          data-i18n-attr="aria-label|footer.socialAria"
          aria-label="Tautan sosial pembuat"
        >
          <a
            class="footer-social-link"
            href="https://tako.id/PIBICh"
            target="_blank"
            rel="noopener noreferrer"
            data-i18n-attr="aria-label|footer.takoAria"
            aria-label="PIBI di Tako"
          >
            <img
              class="footer-social-icon footer-social-icon--tako"
              src="assets/takoicon.png"
              alt=""
              width="28"
              height="28"
              decoding="async"
            />
          </a>
          <a
            class="footer-social-link"
            href="https://www.youtube.com/@pibichori"
            target="_blank"
            rel="noopener noreferrer"
            data-i18n-attr="aria-label|footer.youtubeAria"
            aria-label="YouTube PIBI"
          >
            <img
              class="footer-social-icon"
              src="assets/youtubeicon.svg"
              alt=""
              width="28"
              height="28"
              decoding="async"
            />
          </a>
          <a
            class="footer-social-link"
            href="https://discord.gg/WVyTVnRsJ6"
            target="_blank"
            rel="noopener noreferrer"
            data-i18n-attr="aria-label|footer.discordAria"
            aria-label="Discord"
          >
            <img
              class="footer-social-icon"
              src="assets/discordicon.svg"
              alt=""
              width="28"
              height="28"
              decoding="async"
            />
          </a>
        </nav>
      </footer>
    </div>
    <script src="js/i18n.js"></script>
    <script src="js/mining.js"></script>
    <script src="js/fishing.js"></script>
    <script src="js/guide.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
