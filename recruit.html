<!DOCTYPE html>
<html lang="id" data-i18n-title-key="page.recruitTitle">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        if (sessionStorage.getItem("pwInternalNav") === "1") {
          document.documentElement.classList.add("page-tx--in");
        }
      } catch (e) {}
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="description" content="Pixel Worlds Tools — clan recruitment posts." />
    <title>Rekrutmen clan — Pixel Worlds Tools</title>
    <link rel="icon" href="assets/icon1.png" type="image/png" />
    <link rel="apple-touch-icon" href="assets/icon1.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="page-transition-overlay" class="page-transition-overlay" aria-hidden="true">
      <span class="page-transition-overlay__spinner"></span>
    </div>
    <div class="app">
      <header class="top-nav" role="banner">
        <div class="brand-block">
          <h1 class="brand-heading">
            <a href="mining.html" class="brand-heading-link" data-i18n-attr="aria-label|nav.backHomeAria">
              <img
                class="brand-logo"
                src="assets/pixelworldslogo.png"
                alt="Pixel Worlds"
                decoding="async"
                fetchpriority="high"
              />
            </a>
          </h1>
        </div>
        <div class="top-nav-actions">
          <div class="nav-toolbar">
            <div class="nav-toolbar__cluster">
            <div
              class="segmented segmented--lang lang-toggle"
              role="group"
              data-i18n-attr="aria-label|nav.langAria"
              aria-label="Bahasa"
            >
              <button
                type="button"
                class="lang-btn lang-btn--active"
                data-lang-btn="id"
                data-lang-set="id"
                aria-pressed="true"
              >
                <span class="lang-btn__inner">
                  <span class="lang-flag" aria-hidden="true">
                    <svg viewBox="0 0 3 2" xmlns="http://www.w3.org/2000/svg" focusable="false">
                      <rect width="3" height="1" fill="#e70011" />
                      <rect width="3" height="1" y="1" fill="#ffffff" />
                    </svg>
                  </span>
                  <span class="lang-btn__label">ID</span>
                </span>
              </button>
              <button
                type="button"
                class="lang-btn"
                data-lang-btn="en"
                data-lang-set="en"
                aria-pressed="false"
              >
                <span class="lang-btn__inner">
                  <span class="lang-flag" aria-hidden="true">
                    <svg viewBox="0 0 60 30" xmlns="http://www.w3.org/2000/svg" focusable="false">
                      <path fill="#012169" d="M0 0h60v30H0z" />
                      <path stroke="#fff" stroke-width="6" d="M0 0l60 30M60 0L0 30" />
                      <path stroke="#c8102e" stroke-width="4" d="M0 0l60 30M60 0L0 30" />
                      <path stroke="#fff" stroke-width="10" d="M30 0v30M0 15h60" />
                      <path stroke="#c8102e" stroke-width="6" d="M30 0v30M0 15h60" />
                    </svg>
                  </span>
                  <span class="lang-btn__label">EN</span>
                </span>
              </button>
            </div>
            <nav
              class="segmented segmented--tabs top-nav__tabs tabs"
              data-i18n-attr="aria-label|nav.aria"
              aria-label="Mode kalkulator dan panduan"
            >
              <a href="mining.html" class="tab tab--link" data-i18n-attr="aria-label|tab.miningAria" aria-label="Mining calculator">
                <span data-i18n="tab.mining">Mining</span>
              </a>
              <a href="fishing.html" class="tab tab--link" data-i18n-attr="aria-label|tab.fishingAria" aria-label="Fishing calculator">
                <span data-i18n="tab.fishing">Fishing</span>
              </a>
              <a href="guide.html" class="tab tab--link" data-i18n-attr="aria-label|tab.guideAria" aria-label="Guide">
                <span data-i18n="tab.guide">Guide</span>
              </a>
              <a
                href="recruit.html"
                class="tab tab--link tab--active"
                aria-current="page"
                data-i18n-attr="aria-label|tab.recruitAria"
                aria-label="Clan recruitment"
              >
                <span data-i18n="tab.recruit">Clan</span>
              </a>
            </nav>
            </div>
            <div class="nav-toolbar__profile">
              <a
                href="profile.html"
                class="profile-nav-link"
                data-i18n-attr="aria-label|tab.profileAria"
                aria-label="Profile"
              >
                <span data-i18n="tab.profile">Profil</span>
              </a>
            </div>
          </div>
        </div>
      </header>

      <main>
        <div class="recruit-page">
          <div class="panel-head recruit-page__head">
            <h2 class="panel-title" data-i18n="recruit.title">Clan recruitment</h2>
          </div>
          <p class="recruit-intro" data-i18n="recruit.intro"></p>

          <section class="recruit-section recruit-section--form" aria-labelledby="recruit-form-heading">
            <h3 id="recruit-form-heading" class="recruit-section__title" data-i18n="recruit.formTitle">
              New post
            </h3>
            <p id="recruit-login-hint" class="recruit-login-hint" data-i18n="recruit.loginRequired"></p>
            <a
              href="profile.html"
              class="recruit-btn recruit-btn--primary recruit-cta-profile"
              id="recruit-cta-profile"
              data-i18n="recruit.ctaProfile"
              >Login / Register</a>
            <form id="recruit-form" class="recruit-form" autocomplete="on" hidden>
              <label class="recruit-field">
                <span data-i18n="recruit.field.leader">Clan leader name</span>
                <input id="recruit-leader" name="leader" type="text" required maxlength="120" />
              </label>
              <label class="recruit-field">
                <span data-i18n="recruit.field.clanName">Clan name</span>
                <input id="recruit-clan-name" name="clan_name" type="text" required maxlength="80" />
              </label>
              <label class="recruit-field">
                <span data-i18n="recruit.field.level">Clan level</span>
                <input
                  id="recruit-clan-level"
                  name="clan_level"
                  type="number"
                  min="0"
                  max="999"
                  value="1"
                  required
                />
              </label>
              <label class="recruit-field">
                <span data-i18n="recruit.field.slots">Clan slots</span>
                <input id="recruit-slots" name="slots" type="text" required maxlength="200" placeholder="e.g. 3 / 20" />
              </label>
              <label class="recruit-field">
                <span data-i18n="recruit.field.contact">Discord / group</span>
                <input
                  id="recruit-contact"
                  name="contact"
                  type="text"
                  required
                  maxlength="500"
                  placeholder="https://discord.gg/… or @handle"
                />
              </label>
              <label class="recruit-field recruit-field--checkbox">
                <input id="recruit-is-open" name="is_open" type="checkbox" checked />
                <span data-i18n="recruit.field.stillOpen">Still recruiting</span>
              </label>
              <button type="submit" class="recruit-btn recruit-btn--primary" data-i18n="recruit.submit">
                Publish
              </button>
            </form>
          </section>

          <section class="recruit-section" aria-labelledby="recruit-list-heading">
            <h3 id="recruit-list-heading" class="recruit-section__title" data-i18n="recruit.listTitle">Posts</h3>
            <div id="recruit-list" class="recruit-list" role="list"></div>
            <p id="recruit-empty" class="recruit-empty" hidden data-i18n="recruit.empty"></p>
          </section>

          <p id="recruit-feedback" class="auth-feedback recruit-feedback" hidden></p>
        </div>
      </main>

      <footer class="footer">
        <p class="footer-disclaimer" data-i18n="footer.disclaimer"></p>
        <p class="footer-credit" data-i18n-html="footer.creditHtml"></p>
        <nav
          class="footer-social"
          data-i18n-attr="aria-label|footer.socialAria"
          aria-label="Tautan sosial pembuat"
        >
          <a
            class="footer-social-link"
            href="https://tako.id/PIBICh"
            target="_blank"
            rel="noopener noreferrer"
            data-i18n-attr="aria-label|footer.takoAria"
            aria-label="PIBI di Tako"
          >
            <img
              class="footer-social-icon footer-social-icon--tako"
              src="assets/takoicon.png"
              alt=""
              width="28"
              height="28"
              decoding="async"
            />
          </a>
          <a
            class="footer-social-link"
            href="https://www.youtube.com/@pibichori"
            target="_blank"
            rel="noopener noreferrer"
            data-i18n-attr="aria-label|footer.youtubeAria"
            aria-label="YouTube PIBI"
          >
            <img
              class="footer-social-icon"
              src="assets/youtubeicon.svg"
              alt=""
              width="28"
              height="28"
              decoding="async"
            />
          </a>
          <a
            class="footer-social-link"
            href="https://discord.gg/WVyTVnRsJ6"
            target="_blank"
            rel="noopener noreferrer"
            data-i18n-attr="aria-label|footer.discordAria"
            aria-label="Discord"
          >
            <img
              class="footer-social-icon"
              src="assets/discordicon.svg"
              alt=""
              width="28"
              height="28"
              decoding="async"
            />
          </a>
        </nav>
      </footer>
    </div>
    <script src="js/page-transition.js"></script>
    <script src="js/i18n.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/recruit.js"></script>
  </body>
</html>
