<!DOCTYPE html>
<html lang="id" data-i18n-title-key="page.guideTitle">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        if (sessionStorage.getItem("pwInternalNav") === "1") {
          document.documentElement.classList.add("page-tx--in");
        }
      } catch (e) {}
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Pixel Worlds Tools — guides for Nether, Mining, Fishing, Farming, and Massing."
    />
    <title>Guide — Pixel Worlds Tools</title>
    <link rel="icon" href="assets/icon1.png" type="image/png" />
    <link rel="apple-touch-icon" href="assets/icon1.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="page-transition-overlay" class="page-transition-overlay" aria-hidden="true">
      <span class="page-transition-overlay__spinner"></span>
    </div>
    <div class="app">
      <header class="top-nav" role="banner">
        <div class="top-nav__primary">
          <div class="brand-block">
            <h1 class="brand-heading">
              <a href="mining.html" class="brand-heading-link" data-i18n-attr="aria-label|nav.backHomeAria">
                <img
                  class="brand-logo"
                  src="assets/pixelworldslogo.png"
                  alt="Pixel Worlds"
                  decoding="async"
                  fetchpriority="high"
                />
              </a>
            </h1>
          </div>
          <div class="top-nav__primary-end">
            <div
              class="segmented segmented--lang lang-toggle"
              role="group"
              data-i18n-attr="aria-label|nav.langAria"
              aria-label="Bahasa"
            >
              <button
                type="button"
                class="lang-btn lang-btn--active"
                data-lang-btn="id"
                data-lang-set="id"
                aria-pressed="true"
              >
                <span class="lang-btn__inner">
                  <span class="lang-flag" aria-hidden="true">
                    <svg viewBox="0 0 3 2" xmlns="http://www.w3.org/2000/svg" focusable="false">
                      <rect width="3" height="1" fill="#e70011" />
                      <rect width="3" height="1" y="1" fill="#ffffff" />
                    </svg>
                  </span>
                  <span class="lang-btn__label">ID</span>
                </span>
              </button>
              <button
                type="button"
                class="lang-btn"
                data-lang-btn="en"
                data-lang-set="en"
                aria-pressed="false"
              >
                <span class="lang-btn__inner">
                  <span class="lang-flag" aria-hidden="true">
                    <svg viewBox="0 0 60 30" xmlns="http://www.w3.org/2000/svg" focusable="false">
                      <path fill="#012169" d="M0 0h60v30H0z" />
                      <path stroke="#fff" stroke-width="6" d="M0 0l60 30M60 0L0 30" />
                      <path stroke="#c8102e" stroke-width="4" d="M0 0l60 30M60 0L0 30" />
                      <path stroke="#fff" stroke-width="10" d="M30 0v30M0 15h60" />
                      <path stroke="#c8102e" stroke-width="6" d="M30 0v30M0 15h60" />
                    </svg>
                  </span>
                  <span class="lang-btn__label">EN</span>
                </span>
              </button>
            </div>
            <div class="nav-toolbar__profile">
              <a
                href="profile.html"
                class="profile-nav-link"
                data-i18n-attr="aria-label|tab.profileAria"
                aria-label="Profile — open account page"
              >
                <span data-i18n="tab.profile">Profil</span>
              </a>
            </div>
          </div>
        </div>
        <div class="top-nav__tabs-row">
          <nav
            class="segmented segmented--tabs top-nav__tabs tabs"
            data-i18n-attr="aria-label|nav.aria"
            aria-label="Mode kalkulator dan panduan"
          >
            <a href="mining.html" class="tab tab--link" data-i18n-attr="aria-label|tab.miningAria">
              <span data-i18n="tab.mining">Mining Gems</span>
            </a>
            <a href="fishing.html" class="tab tab--link" data-i18n-attr="aria-label|tab.fishingAria">
              <span data-i18n="tab.fishing">Fishing Gems</span>
            </a>
            <a href="lure-shop.html" class="tab tab--link" data-i18n-attr="aria-label|tab.lureAria">
              <span data-i18n="tab.lure">Lure Shop</span>
            </a>
            <a
              href="guide.html"
              class="tab tab--link tab--active"
              aria-current="page"
              data-i18n-attr="aria-label|tab.guideAria"
            >
              <span data-i18n="tab.guide">Guide</span>
            </a>
            <a href="recruit.html" class="tab tab--link" data-i18n-attr="aria-label|tab.recruitAria">
              <span data-i18n="tab.recruit">Clan Recruit</span>
            </a>
          </nav>
        </div>
      </header>

      <main>
        <section id="panel-guide" class="panel panel--active" aria-labelledby="guide-heading">
          <div class="panel-head">
            <h2 id="guide-heading" class="panel-title" data-i18n="guide.title">Guide</h2>
          </div>
          <nav
            class="guide-subtabs segmented segmented--subtabs"
            role="tablist"
            data-i18n-attr="aria-label|guide.subtabsAria"
            aria-label="Pilih topik panduan"
          >
            <button
              type="button"
              class="guide-subtab guide-subtab--active"
              role="tab"
              data-guide-sub="nether"
              aria-selected="true"
            >
              <span data-i18n="guide.subtab.nether">Nether</span>
            </button>
            <button type="button" class="guide-subtab" role="tab" data-guide-sub="mining" aria-selected="false">
              <span data-i18n="guide.subtab.mining">Mining</span>
            </button>
            <button type="button" class="guide-subtab" role="tab" data-guide-sub="fishing" aria-selected="false">
              <span data-i18n="guide.subtab.fishing">Fishing</span>
            </button>
            <button type="button" class="guide-subtab" role="tab" data-guide-sub="farming" aria-selected="false">
              <span data-i18n="guide.subtab.farming">Farming</span>
            </button>
            <button type="button" class="guide-subtab" role="tab" data-guide-sub="massing" aria-selected="false">
              <span data-i18n="guide.subtab.massing">Massing</span>
            </button>
            <button type="button" class="guide-subtab" role="tab" data-guide-sub="puzzle" aria-selected="false">
              <span data-i18n="guide.subtab.puzzle">Puzzle</span>
            </button>
          </nav>

          <div
            id="guide-view-nether"
            class="guide-subpanel guide-subpanel--active"
            role="tabpanel"
            data-guide-panel="nether"
          >
            <div id="guide-nether-root"></div>
          </div>
          <div id="guide-view-mining" class="guide-subpanel" hidden role="tabpanel" data-guide-panel="mining">
            <div id="guide-mining-root"></div>
          </div>
          <div id="guide-view-fishing" class="guide-subpanel" hidden role="tabpanel" data-guide-panel="fishing">
            <div id="guide-fishing-root"></div>
          </div>
          <div id="guide-view-farming" class="guide-subpanel" hidden role="tabpanel" data-guide-panel="farming">
            <div id="guide-farming-root"></div>
          </div>
          <div id="guide-view-massing" class="guide-subpanel" hidden role="tabpanel" data-guide-panel="massing">
            <div id="guide-massing-root"></div>
          </div>
          <div id="guide-view-puzzle" class="guide-subpanel" hidden role="tabpanel" data-guide-panel="puzzle">
            <div id="guide-puzzle-root"></div>
          </div>
        </section>
      </main>

      <footer class="footer">
        <p class="footer-disclaimer" data-i18n="footer.disclaimer"></p>
        <p class="footer-credit" data-i18n-html="footer.creditHtml"></p>
        <nav
          class="footer-social"
          data-i18n-attr="aria-label|footer.socialAria"
          aria-label="Tautan sosial pembuat"
        >
          <a
            class="footer-social-link"
            href="https://tako.id/PIBICh"
            target="_blank"
            rel="noopener noreferrer"
            data-i18n-attr="aria-label|footer.takoAria"
            aria-label="PIBI di Tako"
          >
            <img
              class="footer-social-icon footer-social-icon--tako"
              src="assets/takoicon.png"
              alt=""
              width="28"
              height="28"
              decoding="async"
            />
          </a>
          <a
            class="footer-social-link"
            href="https://www.youtube.com/@pibichori"
            target="_blank"
            rel="noopener noreferrer"
            data-i18n-attr="aria-label|footer.youtubeAria"
            aria-label="YouTube PIBI"
          >
            <img
              class="footer-social-icon"
              src="assets/youtubeicon.svg"
              alt=""
              width="28"
              height="28"
              decoding="async"
            />
          </a>
          <a
            class="footer-social-link"
            href="https://discord.gg/WVyTVnRsJ6"
            target="_blank"
            rel="noopener noreferrer"
            data-i18n-attr="aria-label|footer.discordAria"
            aria-label="Discord"
          >
            <img
              class="footer-social-icon"
              src="assets/discordicon.svg"
              alt=""
              width="28"
              height="28"
              decoding="async"
            />
          </a>
        </nav>
      </footer>
    </div>
    <script src="js/page-transition.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/fossil-puzzle.js"></script>
    <script src="js/guide.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
